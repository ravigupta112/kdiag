[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kdiag"
version = "0.1.0"
description = "Deterministic, read-only Kubernetes deployment failure diagnosis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/kdiag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ISC004", "ISC001", "E501"]
