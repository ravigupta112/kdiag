[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[project]
name = "kdiag"
version = "0.2.0"
description = "Deterministic, read-only Kubernetes deployment failure diagnosis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
k8s = ["kubernetes-asyncio>=29", "pyyaml>=6"]
service = ["fastapi>=0.110", "pyyaml>=6"]
metrics = ["prometheus-client>=0.20"]
dev = ["pytest>=8", "hypothesis>=6", "ruff", "mypy", "httpx>=0.27", "types-PyYAML",
       "kubernetes-asyncio>=29", "pyyaml>=6", "fastapi>=0.110", "prometheus-client>=0.20"]

[tool.hatch.build.targets.wheel]
packages = ["src/kdiag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
strict = true
exclude = ["tests/"]
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ISC004", "ISC001", "E501"]
