# Maps every item (1-173) of the team's error master list to the rule that diagnoses it, or to an
# explicit disposition. CI fails if an item is unmapped, double-mapped, or names an unknown rule.
# Dispositions:
#   INFO            not an error (normal lifecycle state)
#   SYMPTOM         a generic status that other rules explain; no standalone rule
#   STATUS          reported through the report status (target_not_found, etc.)
#   SOURCE_ERROR    reported as a partial-read/source error, never as a workload finding
#   NOT_IMPLEMENTED needs evidence kdiag does not read yet (honest gap)
#   OUT_OF_SCOPE    cannot be diagnosed from deployment-scoped, read-only evidence
rules:
  SCHED-001: "1, 22-29"
  IMG-001: "2-5, 39-47, 49, 91, 92-94"
  POD-004: "6"
  POD-002: "7, 9, 10"
  CFG-001: "8, 89, 90, 125, 126"
  POD-005: "12, 13"
  POD-006: "14"
  NODE-001: "15, 16, 17, 150-154"
  ADM-001: "31-38, 48, 61, 81-88, 99, 108, 114, 118, 120, 124"
  STO-001: "50, 51, 58-60, 62"
  STO-002: "52-57, 63"
  NET-001: "64, 65, 73, 74"
  NET-002: "80"
  APP-003: "66, 69"
  PRB-001: "100-107"
  WL-001: "110"
  WL-002: "109"
  WL-003: "116, 117"
  APP-001: "123, 128-130"
  APP-002: "131, 133"
  HLM-001: "135, 136"
  HLM-002: "137"
  HLM-003: "138, 148"
  HLM-004: "139, 140, 143, 146"
  HLM-005: "141"
  HLM-006: "142, 161"
  HLM-009: "149"
  HLM-010: "144, 147, 162, 171"
  HLM-011: "167, 168, 170"
  HLM-012: "145"
  HLM-014: "172"
dispositions:
  INFO: {items: "18, 19, 112, 11", reason: "normal state or generic retry reason, not a cause"}
  SYMPTOM: {items: "20, 21, 111", reason: "generic status explained by specific rules"}
  STATUS: {items: "173", reason: "reported as status target_not_found"}
  SOURCE_ERROR: {items: "158-160, 163-166, 169", reason: "API/credential errors surface as partial reads or cluster_unreachable"}
  NOT_IMPLEMENTED:
    items: "30, 67, 68, 70, 71, 72, 76-79, 95-98, 113, 115, 119, 121, 122, 127, 134, 155, 156"
    reason: "needs Ingress, NetworkPolicy, HPA, cert-manager, DNS/CNI-health, kubelet or app-config evidence not read yet"
  OUT_OF_SCOPE: {items: "75, 132, 157", reason: "needs traffic metrics, CI build output, or etcd/control-plane access"}

